<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A14 Mortgage payout</title>
<link rel="stylesheet" href="../styles/v2.css">
<style>
  /* Calm and clear. One loan officer's month, loan by loan; the pending loan is lit so it's obvious what's still coming. */
  .ad { background: radial-gradient(1000px 760px at 100% 100%, #DCE2FC 0%, rgba(220,226,252,0) 70%), linear-gradient(180deg, #F7F6F2 0%, #EEF0FA 100%); }
  .ring { position: absolute; right: -260px; top: 300px; width: 900px; height: 900px; border-radius: 50%; border: 2px solid rgba(96,120,236,.14); }
  .ring.b { right: -160px; top: 400px; width: 700px; height: 700px; }
  .hl { position: absolute; left: var(--m); top: 86px; width: 940px; font-size: 88px; }
  .hl em { color: var(--peri-deep); }

  .card { position: absolute; left: var(--m); top: 430px; width: 936px; border-radius: 40px; background: #fff; padding: 40px 44px 38px;
    box-shadow: 0 1px 0 rgba(13,16,32,.04), 0 30px 70px -30px rgba(40,52,140,.35), 0 10px 24px -14px rgba(13,16,32,.18); }
  .head { display: flex; align-items: center; gap: 22px; padding-bottom: 28px; border-bottom: 2px solid #EEF0F5; }
  .head img { width: 76px; height: 76px; border-radius: 20px; }
  .head b { display: block; font: 800 46px/1.05 "Schibsted Grotesk"; letter-spacing: -0.02em; }
  .head span { display: block; font: 500 29px/1.2 "DM Sans"; color: #5d6075; margin-top: 8px; white-space: pre; }
  .badge { position: absolute; right: -18px; top: -42px; display: flex; align-items: center; gap: 14px; padding: 20px 34px 20px 20px; border-radius: 999px;
    background: var(--green); color: #fff; font: 700 32px/1 "DM Sans"; transform: rotate(3deg); box-shadow: 0 14px 30px -10px rgba(20,120,90,.55); }
  .badge svg { width: 38px; height: 38px; }
  .row { display: flex; align-items: center; gap: 24px; height: 128px; padding: 0 22px; margin: 0 -22px; border-bottom: 2px solid #F1F2F6; }
  .row .st { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .row .st svg { width: 26px; height: 26px; }
  .row .k { font: 600 39px/1 "DM Sans"; letter-spacing: -0.01em; flex: 1; }
  .row .v { font: 800 46px/1 "Schibsted Grotesk"; letter-spacing: -0.02em; }
  .row.ok .st { background: #DDF5EE; color: #149475; }
  .row.hot { background: #FFF4DA; border-radius: 24px; border-bottom-color: transparent; box-shadow: inset 6px 0 0 #F2A516, 0 0 0 2px #F6D58A; position: relative; z-index: 1; height: 138px; margin-top: 10px; }
  .row.hot .st { background: #FBD98A; color: #8A5300; }
  .row.hot .k { color: #4a3300; }
  .row.hot .v { font: 700 32px/1 "DM Sans"; padding: 14px 26px; border-radius: 999px; background: #F2A516; color: #fff; letter-spacing: 0; }
  .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 34px; margin-top: 14px; border-top: 2px solid #E6E8EF; }
  .tot span { font: 600 36px/1 "DM Sans"; color: #5d6075; }
  .tot b { font: 800 84px/1 "Schibsted Grotesk"; letter-spacing: -0.04em; }
  .chip .g { background: var(--peri); color: #fff; }
</style></head>
<body><div class="ad grain">
  <div class="ring"></div><div class="ring b"></div>
  <h1 class="hl">Loan officers check their pay twice. Make the <em>first time enough.</em></h1>

  <div class="card">
    <div class="badge"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="rgba(255,255,255,.25)"/><path d="M9.5 16.5l4.5 4.5 8.5-9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Status on every loan</div>
    <div class="head"><img src="../../../02_Brand_Assets/logo/sequifi-app-icon.svg" alt=""><div><b>Loan officer comp</b><span>LO: D. Patel  |  Period: October</span></div></div>
    <div class="row ok"><span class="st"><svg viewBox="0 0 26 26"><path d="M6 13.5l4.5 4.5L20 8.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="k">Carter loan, funded</span><span class="v">$2,400</span></div>
    <div class="row ok"><span class="st"><svg viewBox="0 0 26 26"><path d="M6 13.5l4.5 4.5L20 8.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="k">Nguyen loan, funded</span><span class="v">$1,950</span></div>
    <div class="row hot"><span class="st"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2.8"/><path d="M13 8.5V13l3 2.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></span><span class="k">Brooks loan, pending</span><span class="v">Pending</span></div>
    <div class="tot"><span>Total</span><b>$4,350</b></div>
  </div>

  <div class="signoff">
    <span class="chip ink"><span class="g"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span>MORTGAGE LEADERS</span>
    <img class="logo" src="../../../02_Brand_Assets/logo/sequifi-logo-dark-text.svg" alt="Sequifi">
  </div>
</div></body></html>
