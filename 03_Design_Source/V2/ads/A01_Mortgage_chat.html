<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A01 Mortgage chat</title>
<link rel="stylesheet" href="../styles/v2.css">
<style>
  /* Night. A text at 9:41 PM from a loan officer. The punchline bubble breaks out of the screen. */
  .ad { background: radial-gradient(900px 760px at 70% 72%, #26307a 0%, #121638 42%, #080a18 78%); color: #fff; }
  .ad::before { /* faint window-light bokeh, far behind */
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(60px 60px at 12% 64%, rgba(143,160,245,.16), transparent 70%),
      radial-gradient(40px 40px at 20% 78%, rgba(143,160,245,.12), transparent 70%),
      radial-gradient(90px 90px at 7% 88%, rgba(96,120,236,.14), transparent 70%),
      radial-gradient(30px 30px at 26% 58%, rgba(255,214,170,.10), transparent 70%);
  }
  .hl { position: absolute; left: var(--m); top: 86px; width: 920px; font-size: 86px; color: #fff; }
  .hl em { color: #AEBBFF; }

  .phone { left: 356px; top: 404px; width: 680px; height: 1300px; transform: rotate(5deg); transform-origin: 50% 0; }
  .screen { --screen-bg: #fff; color: #0b0b0f; }
  .chathead { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0 0 22px; border-bottom: 1.5px solid #ececf0; position: relative; }
  .chathead .back { position: absolute; left: 38px; top: 30px; width: 22px; height: 38px; }
  .chathead .av { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(180deg, #a3a8b8, #7d8396); display: grid; place-items: center; font: 600 38px/1 "Inter"; color: #fff; }
  .chathead .name { font: 600 30px/1 "Inter"; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
  .chathead .name svg { width: 14px; height: 22px; }
  .chathead .svc { font: 500 22px/1 "Inter"; color: #8a8a8f; }
  .day { text-align: center; font: 500 22px/1 "Inter"; color: #8a8a8f; padding: 26px 0 18px; }
  .day b { font-weight: 600; }
  .thread { padding: 30px 30px 0; }
  .bub { font-size: 34px; max-width: 86%; }
  .ghost { visibility: hidden; }
  .receipt { align-self: flex-end; margin: 2px 10px 0 0; }

  /* the punchline, lifted out of the phone */
  .pop {
    position: absolute; left: 70px; top: 1004px; z-index: 20; transform: rotate(-3.5deg);
    font-size: 54px; padding: 30px 66px 34px 50px; border-radius: 62px 62px 62px 22px; max-width: none; white-space: nowrap;
    box-shadow: 0 2px 0 rgba(255,255,255,.6) inset, 0 0 0 3px rgba(174,187,255,.55), 0 0 60px -4px rgba(143,160,245,.55), 0 34px 60px -18px rgba(0,0,0,.65), 0 10px 24px -8px rgba(0,0,0,.35);
    --screen-bg: transparent;
  }
  .pop .tl { position: absolute; left: -17px; bottom: 0; width: 46px; height: 46px; fill: #E9E9EB; }
  .pop .emoji { height: 1.1em; width: 1.1em; margin-left: 6px; vertical-align: -0.2em; }
  .pop-receipt { position: absolute; left: 556px; top: 1152px; z-index: 40; transform: rotate(-3.5deg); color: rgba(255,255,255,.82); font-size: 28px; }

  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; z-index: 30;
    background: linear-gradient(180deg, rgba(8,10,24,0) 0%, rgba(8,10,24,.86) 48%, #080a18 78%); }
  .chip .g { background: rgba(96,120,236,.28); color: #C3CCFF; }
</style></head>
<body><div class="ad grain on-dark">

  <h1 class="hl">Your loan officers shouldn’t have to ask if their <em>pay is right.</em></h1>

  <div class="phone"><div class="screen">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span class="icons"><span class="bars"><i style="height:8px"></i><i style="height:12px"></i><i style="height:17px"></i><i style="height:22px"></i></span><span class="batt"><b></b></span></span></div>
    <div class="chathead">
      <svg class="back" viewBox="0 0 22 38"><path d="M19 3 4 19l15 16" fill="none" stroke="#1B84FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="av">L</div>
      <div class="name">Loan Officer<svg viewBox="0 0 14 22"><path d="m3 4 7 7-7 7" fill="none" stroke="#b5b5ba" stroke-width="3" stroke-linecap="round"/></svg></div>
      <div class="svc">iMessage</div>
    </div>
    <div class="thread">
      <div class="bub in tail">Hey, is the Carter loan in this month’s payout?</div>
      <div class="bub out tail">Checking. Give me till tomorrow.</div>
      <div class="bub in tail ghost" style="font-size:35px">Third time this quarter 😅</div>
    </div>
  </div></div>

  <div class="bub in pop"><svg class="tl" viewBox="0 0 46 46"><path d="M46 0V46H6C1 46-1 42 3 39 13 31 17 19 17 0Z"/></svg>Third time this quarter<img class="emoji" src="../assets/emoji/1f605.svg" alt="😅"></div>
  <div class="receipt pop-receipt"><b>Read</b> 9:41 PM</div>

  <div class="scrim"></div>
  <div class="signoff">
    <span class="chip glass"><span class="g"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span>MORTGAGE LEADERS</span>
    <img class="logo" src="../../../02_Brand_Assets/logo/sequifi-logo-white-text.svg" alt="Sequifi">
  </div>
</div></body></html>
