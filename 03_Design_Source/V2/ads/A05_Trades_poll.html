<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A05 Trades poll</title>
<link rel="stylesheet" href="../styles/v2.css">
<style>
  /* A quick question from a friend, taped to the shop wall. Warm cream, hi-vis yellow, no corporate polish. */
  .ad { background: radial-gradient(640px 640px at 100% 62%, rgba(255,194,26,.55), rgba(255,194,26,0) 70%), linear-gradient(175deg, #F8F1E2 0%, #F1E6CF 100%); }
  .hl { position: absolute; left: var(--m); top: 84px; width: 960px; font-size: 86px; color: #1D1A15; text-wrap: wrap; }
  .hi { background: linear-gradient(100deg, rgba(255,194,26,0) 0%, #FFC21A 1.5%, #FFCB33 97%, rgba(255,194,26,0) 100%) 0 88% / 100% 64% no-repeat;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 8px; margin: 0 -8px; }

  .poll { position: absolute; left: 92px; top: 424px; width: 896px; padding: 40px 44px 46px; border-radius: 48px; background: #fff; transform: rotate(-2deg);
    box-shadow: 0 2px 0 rgba(0,0,0,.03), 0 40px 70px -30px rgba(90,60,0,.45), 0 12px 22px -12px rgba(90,60,0,.22); }
  .tape { position: absolute; width: 170px; height: 52px; background: rgba(255,214,90,.62); box-shadow: 0 1px 2px rgba(0,0,0,.06); z-index: 3; }
  .label { display: inline-flex; align-items: center; gap: 12px; font: 800 29px/1 "Schibsted Grotesk"; letter-spacing: .1em; color: #1D1A15; margin: 0 0 26px 6px; }
  .label .emoji { width: 48px; height: 48px; vertical-align: middle; }
  .opt { display: flex; align-items: center; gap: 26px; height: 136px; padding: 0 38px; border-radius: 999px; margin-top: 18px;
    box-shadow: inset 0 0 0 3px #ECE5D6; font: 600 48px/1 "DM Sans"; letter-spacing: -0.02em; color: #1D1A15; }
  .opt .r { width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 0 0 0 4px #CFC7B5; flex: none; }
  .opt.on { background: #1D1A15; color: #fff; box-shadow: 0 18px 30px -14px rgba(29,26,21,.7); transform: scale(1.035); }
  .opt.on .r { background: #FFC21A; box-shadow: inset 0 0 0 9px #FFC21A, inset 0 0 0 30px #1D1A15; }
  .opt.on .ck { margin-left: auto; width: 58px; height: 58px; border-radius: 50%; background: #FFC21A; display: grid; place-items: center; }
  .opt.on .ck svg { width: 32px; height: 32px; }
  .sub { position: absolute; left: var(--m); top: 1104px; color: #4A4234; }
  .chip .g { background: #FFC21A; color: #1D1A15; }
</style></head>
<body><div class="ad grain">
  <h1 class="hl">How long does<br><span class="hi"><span style="white-space:nowrap">month-end</span> commission close</span> take you?</h1>

  <div class="poll">
    <div class="tape" style="left:-36px;top:-14px;transform:rotate(-24deg)"></div>
    <div class="tape" style="right:-36px;top:-14px;transform:rotate(22deg)"></div>
    <div class="label">TAP TO VOTE <img class="emoji" src="../assets/emoji/1f440.svg" alt="👀"></div>
    <div class="opt"><span class="r"></span>Under an hour</div>
    <div class="opt on"><span class="r"></span>Most of a day<span class="ck"><svg viewBox="0 0 32 32"><path d="M8 16.5l5.5 5.5L24.5 10.5" fill="none" stroke="#1D1A15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="opt"><span class="r"></span>We don’t talk about it</div>
  </div>

  <p class="sub">Be honest. Your reps won’t see this.</p>

  <div class="signoff">
    <span class="chip ink"><span class="g"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>TRADES OWNERS</span>
    <img class="logo" src="../../../02_Brand_Assets/logo/sequifi-logo-dark-text.svg" alt="Sequifi">
  </div>
</div></body></html>
