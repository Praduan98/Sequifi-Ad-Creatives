<!doctype html>

<link rel="stylesheet" href="../styles/v2.css">
<style>
  /* The closer's screenshot: a phone sheet, cropped, marked up in red pen, about to be sent.
     Crop handles and a markup toolbar make it read as "your rep found this", not "your sheet". */
  .ad { background: radial-gradient(1000px 700px at 50% 112%, #F59A2E 0%, rgba(245,154,46,0) 60%), linear-gradient(180deg, #24123A 0%, #4A1E44 52%, #8A3A34 100%); color: #fff; }
  .sun { position: absolute; left: 50%; bottom: -360px; width: 900px; height: 900px; margin-left: -450px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,214,140,.55), rgba(255,170,70,.18) 60%, rgba(255,170,70,0)); }
  .hl { position: absolute; left: var(--m); top: 84px; width: 940px; font-size: 88px; color: #fff; }
  .hl em { color: #FFC46B; }

  .shot { position: absolute; left: 104px; top: 400px; width: 820px; transform: rotate(2.5deg); z-index: 5; }
  .card { border-radius: 34px; overflow: hidden; background: #fff; color: #1f2328; font-family: "Inter";
    box-shadow: 0 0 0 8px rgba(255,255,255,.95), 0 50px 90px -30px rgba(10,0,20,.75), 0 18px 40px -16px rgba(10,0,20,.5); }
  .appbar { height: 84px; display: flex; align-items: center; gap: 18px; padding: 0 28px; background: #F4F7F5; border-bottom: 1.5px solid #DDE3DF; }
  .appbar .back { width: 18px; height: 32px; }
  .appbar .ic { width: 40px; height: 40px; border-radius: 9px; background: #188038; display: grid; place-items: center; }
  .appbar .ic svg { width: 24px; height: 24px; }
  .appbar b { font: 600 29px/1 "Inter"; }
  .fx { height: 62px; display: flex; align-items: center; gap: 4px; padding: 0 22px; border-bottom: 1.5px solid #DDE3DF; }
  .fx .f { width: 46px; font: italic 400 32px/1 "Instrument Serif", serif; color: #6b7280; }
  .fx .v { font: 400 25px/1 "Space Mono", monospace; letter-spacing: -0.03em; }
  table { border-collapse: collapse; table-layout: fixed; width: 820px; }
  th { height: 38px; background: #F6F7F9; border: 1.5px solid #DFE2E6; font: 500 19px/1 "Inter"; color: #6b7280; }
  td { height: 78px; border: 1.5px solid #E5E8EB; padding: 0 18px; font: 400 33px/1 "Inter"; white-space: nowrap; }
  td.rn { background: #F6F7F9; color: #6b7280; text-align: center; padding: 0; font-size: 19px; font-weight: 500; }
  td.n { text-align: right; }
  tr.h td { font-weight: 700; background: #FAFBFC; }
  td.q { text-align: right; font-weight: 800; font-size: 42px; color: #B42318; background: #FFF4E5; }
  .pad { height: 104px; position: relative; }

  /* markup, drawn over the screenshot */
  .ink { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .note { position: absolute; left: 110px; top: 590px; font: 700 74px/1 "Caveat"; color: #FF3B30; transform: rotate(-3deg); }

  .crop i { position: absolute; width: 58px; height: 58px; border: 0 solid #fff; }
  .crop i:nth-child(1) { left: -20px; top: -20px; border-width: 9px 0 0 9px; border-top-left-radius: 14px; }
  .crop i:nth-child(2) { right: -20px; top: -20px; border-width: 9px 9px 0 0; border-top-right-radius: 14px; }
  .crop i:nth-child(3) { left: -20px; bottom: -20px; border-width: 0 0 9px 9px; border-bottom-left-radius: 14px; }
  .crop i:nth-child(4) { right: -20px; bottom: -20px; border-width: 0 9px 9px 0; border-bottom-right-radius: 14px; }

  .tools { position: absolute; left: 50%; top: 1148px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 26px; padding: 14px 30px;
    border-radius: 999px; background: rgba(20,10,28,.55); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); backdrop-filter: blur(10px); }
  .tools svg { width: 34px; height: 46px; }
  .tools .sep { width: 2px; height: 36px; background: rgba(255,255,255,.2); }
  .tools .c { width: 32px; height: 32px; border-radius: 50%; }
  .tools .c.on { box-shadow: 0 0 0 4px rgba(20,10,28,.9), 0 0 0 7px #fff; }
  .chip .g { background: #F6A52A; color: #3A1E00; }
</style></head>
