<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A16 Mortgage bigtype</title>
<link rel="stylesheet" href="../styles/v2.css">
<style>
  /* Pure statement on warm paper. A giant serif $ sits behind; the sentence sets up, then "Until payday." lands. */
  .ad { background: radial-gradient(900px 800px at 100% 100%, #E6E9FB 0%, rgba(230,233,251,0) 70%), linear-gradient(170deg, #F6F3EC 0%, #EFEBE2 100%); }
  .sym { position: absolute; right: -150px; top: -170px; font: italic 400 1720px/1 "Instrument Serif", serif; color: var(--peri); opacity: .10; letter-spacing: 0; }
  .sym.o { color: transparent; -webkit-text-stroke: 3px rgba(96,120,236,.22); opacity: 1; }
  .hl { position: absolute; left: var(--m); top: 300px; width: 900px; font-size: 116px; line-height: .97; letter-spacing: -0.045em; }
  .turn { position: absolute; left: 64px; top: 718px; font: italic 400 214px/0.9 "Instrument Serif", serif; letter-spacing: -0.03em; color: var(--peri-deep); white-space: nowrap; }
  .turn::after { content: ""; position: absolute; left: 10px; right: 30px; bottom: -14px; height: 10px; border-radius: 6px; background: var(--peri); opacity: .25; }
  .sub { position: absolute; left: var(--m); top: 1012px; width: 820px; color: var(--body); }
  .chip .g { background: var(--peri); color: #fff; }
</style></head>
<body><div class="ad grain">
  <div class="sym" aria-hidden="true">$</div>
  <div class="sym o" aria-hidden="true">$</div>
  <h1 class="hl">Variable comp is a good problem to have.</h1>
  <div class="turn">Until payday.</div>
  <p class="sub">Sequifi runs the math so payday is boring.</p>
  <div class="signoff">
    <span class="chip ink"><span class="g"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span>MORTGAGE LEADERS</span>
    <img class="logo" src="../../../02_Brand_Assets/logo/sequifi-logo-dark-text.svg" alt="Sequifi">
  </div>
</div></body></html>
